name = "ristorante-oasi"
main = "server/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "oasi-db"
database_id = "f8247322-1e5a-4328-b06c-8ed38194f569"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "oasi-media"

[vars]
PUBLIC_URL = "https://ristorante-oasi.ferafra595.workers.dev"

# Promemoria: il Worker controlla l'ora Europe/Rome e invia alle 17 locali.
# 15 UTC durante l'ora legale, 16 UTC durante l'ora solare.
[triggers]
crons = ["0 15,16 * * *"]
