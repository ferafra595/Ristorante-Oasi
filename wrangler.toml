name = "oasi-ristorante"
main = "server/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
[[d1_databases]]
binding = "DB"
database_name = "oasi-db"
database_id = "f8247322-1e5a-4328-b06c-8ed38194f569"
migrations_dir = "migrations"
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "oasi-media"
[vars]
PUBLIC_URL = "http://localhost:8787"
